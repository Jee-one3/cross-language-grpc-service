syntax = "proto3";

package person;

option go_package = "example.com/grpc-person-crud/go/generated;personpb";

service PersonService {

    rpc CreatePerson(CreatePersonRequest)
        returns (Person);

    rpc GetPerson(GetPersonRequest)
        returns (Person);

    rpc UpdatePerson(UpdatePersonRequest)
        returns (Person);

    rpc DeletePerson(DeletePersonRequest)
        returns (DeletePersonResponse);
}


// Main Person object
message Person {
    int32 id = 1;
    string name = 2;
    string email = 3;
    string phone = 4;
}


// CREATE
message CreatePersonRequest {
    string name = 1;
    string email = 2;
    string phone = 3;
}


// READ
message GetPersonRequest {
    int32 id = 1;
}


// UPDATE
message UpdatePersonRequest {
    int32 id = 1;
    string name = 2;
    string email = 3;
    string phone = 4;
}


// DELETE
message DeletePersonRequest {
    int32 id = 1;
}


message DeletePersonResponse {
    string message = 1;
}